<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillNest Academy - শিখুন। তৈরি করুন। ক্যারিয়ারে এগিয়ে যান।</title>
    <meta name="description" content="Modern Online Course Selling & Learning Management System (LMS) for Bangladesh - ইন্ডাস্ট্রি-ফোকাসড কোর্স ও মেন্টরশিপ" />
    <meta property="og:title" content="SkillNest Academy - Bangladesh EdTech & LMS" />
    <meta property="og:description" content="ইন্ডাস্ট্রি-ফোকাসড কোর্স, বাস্তব প্রজেক্ট এবং অভিজ্ঞ মেন্টরের গাইডলাইনে নিজের ক্যারিয়ার তৈরি করুন।" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('skillnest_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
